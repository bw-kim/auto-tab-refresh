<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>탭 자동 새로고침</title><link rel="stylesheet" href="popup.css"></head>
<body><main><header><div class="mark"><img src="icons/icon48.png" alt=""></div><div><div class="eyebrow">AUTO REFRESH</div><h1>탭 자동 새로고침</h1></div><span class="spark" aria-hidden="true">✦</span></header>
<div id="tabCard" class="tab-card"><span class="section-label">현재 탭</span><div id="tabTitle" class="tab-title">탭을 확인하고 있어요</div><div id="tabHost" class="tab-host"></div></div>
<div id="controls"><label for="amount">새로고침 간격</label><div class="interval"><input type="number" id="amount" value="1" min="1" max="86400" step="1" inputmode="numeric"><select id="unit" aria-label="시간 단위"><option value="60">분</option><option value="1">초</option><option value="3600">시간</option></select></div><p class="hint">30초부터 24시간까지 설정할 수 있어요.</p><div class="presets" aria-label="빠른 간격 선택"><button type="button" data-seconds="30">30초</button><button type="button" data-seconds="60">1분</button><button type="button" data-seconds="300">5분</button><button type="button" data-seconds="600">10분</button></div><div class="primary-actions"><button type="button" id="start" class="start">자동 새로고침 시작</button><button type="button" id="stop" class="stop" hidden>중지</button></div></div>
<p id="status" class="status" role="status" aria-live="polite"></p><div id="nextRefresh" class="next-refresh" hidden><span>다음 새로고침</span><strong id="countdown">확인 중</strong></div><div class="list-heading"><span>새로고침 중인 탭</span><span id="count" class="count">0</span></div><div id="list" class="list"></div><footer>브라우저가 켜져 있는 동안 동작하며, 절전 중에는 지연될 수 있어요.</footer></main><script src="popup.js"></script></body></html>
